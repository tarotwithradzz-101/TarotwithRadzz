/* TAROT CARD GRID */
.deck{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:28px;position:relative;z-index:1;
}
.tcard{
  position:relative;
  background:linear-gradient(160deg,rgba(255,255,255,.92) 0%,rgba(245,240,255,.7) 50%,rgba(247,232,192,.4) 100%);
  border:1px solid rgba(216,179,106,.3);
  overflow:hidden;
  transition:all .5s cubic-bezier(.25,.46,.45,.94);
  cursor:default;
  transform-style:preserve-3d;
}
/* ornamental top */
.tcard::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,transparent,var(--gold),rgba(196,176,232,.8),var(--gold),transparent);
}
/* inner border */
.tcard-border{
  position:absolute;inset:10px;
  border:1px solid rgba(216,179,106,.2);
  pointer-events:none;z-index:0;
  transition:border-color .5s;
}
/* corner ornaments */
.tcard-co{
  position:absolute;width:20px;height:20px;pointer-events:none;z-index:1;
  color:rgba(216,179,106,.4);font-size:.7rem;line-height:1;
  transition:color .5s,opacity .5s;
}
.tcard-co.tl{top:14px;left:14px}
.tcard-co.tr{top:14px;right:14px;text-align:right}
.tcard-co.bl{bottom:14px;left:14px}
.tcard-co.br{bottom:14px;right:14px;text-align:right}

.tcard:hover{
  transform:translateY(-12px) scale(1.02);
  border-color:rgba(216,179,106,.55);
  box-shadow:0 32px 80px rgba(57,40,75,.18),0 0 0 1px rgba(216,179,106,.2),0 0 40px rgba(216,179,106,.12);
}
.tcard:hover .tcard-border{border-color:rgba(216,179,106,.45)}
.tcard:hover .tcard-co{color:rgba(216,179,106,.8);opacity:1}

/* glow on hover */
.tcard::after{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 0%,rgba(216,179,106,.12) 0%,transparent 70%);
  opacity:0;transition:opacity .5s;pointer-events:none;
}
.tcard:hover::after{opacity:1}

/* floating animation per card */
.tcard:nth-child(1){animation:floatYs 7s 0s ease-in-out infinite}
.tcard:nth-child(2){animation:floatYs 9s 1s ease-in-out infinite}
.tcard:nth-child(3){animation:floatYs 8s 2s ease-in-out infinite}
.tcard:nth-child(4){animation:floatYs 10s .5s ease-in-out infinite}
.tcard:nth-child(5){grid-column:span 2;animation:floatYs 8s 1.5s ease-in-out infinite}

.tcard-body{padding:44px 36px 40px;position:relative;z-index:2}

}

  font-size:1.6rem;margin-bottom:20px;
  box-shadow:0 4px 24px rgba(216,179,106,.2);
  transition:all .4s;
}
.tcard:hover .tcard-icon{
  box-shadow:0 8px 36px rgba(216,179,106,.4);
  transform:scale(1.1) rotate(3deg);
}
.tcard h3{
  font-family:'Cormorant Garamond',serif;font-size:1.5rem;font-weight:400;

}

  position:absolute;bottom:18px;right:22px;
  font-family:'Cormorant Garamond',serif;font-size:2.2rem;font-weight:300;
  color:rgba(216,179,106,.15);font-style:italic;
  transition:color .5s;
}
.tcard:hover .tcard-num{color:rgba(216,179,106,.35)}

@media(max-width:900px){
  .deck{grid-template-columns:1fr 1fr}
  .tcard:nth-child(5){grid-column:span 1}
}

  .deck{grid-template-columns:1fr}

/* ════ PICK A CARD ════ */

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
:root{
  --ivory:#FAF7F2;--ivory2:#F5F0E8;
  --lav:#F5F0FF;--lav-mid:#E8DFFF;--lav-deep:#C4B0E8;
  --plum:#39284B;--plum-mid:#4A3560;--plum-deep:#1E1230;
  --accent:#7B5E9A;
  --gold:#D8B36A;--gold-bright:#F0CC80;--gold-pale:#F7E8C0;--gold-deep:#B8903A;
  --rose:#F0E0E8;
  --text:#39284B;--text-mid:#6A5480;--text-soft:#9A88AA;
  --border-g:rgba(216,179,106,0.25);
}
body{
  background:var(--ivory);color:var(--text);
  font-family:'Jost',sans-serif;font-weight:300;
  overflow-x:hidden;line-height:1.75;
  min-height:100vh;
}

/* ══ PICK A CARD SECTION ══ */
#pick-a-card{
  padding:120px 0 140px;
  position:relative;overflow:hidden;
  background:linear-gradient(180deg,
    var(--ivory) 0%,
    var(--lav) 20%,
    rgba(245,240,255,0.95) 50%,
    var(--rose) 75%,
    var(--gold-pale) 90%,
    var(--ivory) 100%
  );
}

/* background orbs */
.pac-orb{position:absolute;border-radius:50%;pointer-events:none}
.pac-o1{width:700px;height:700px;top:-200px;left:-200px;
  background:radial-gradient(circle,rgba(196,176,232,0.2) 0%,transparent 70%);
  animation:orbPulse 10s ease-in-out infinite}
.pac-o2{width:600px;height:600px;bottom:-150px;right:-150px;
  background:radial-gradient(circle,rgba(216,179,106,0.13) 0%,transparent 70%);
  animation:orbPulse 13s ease-in-out infinite reverse}
.pac-o3{width:350px;height:350px;top:30%;right:5%;
  background:radial-gradient(circle,rgba(240,224,232,0.5) 0%,transparent 70%);
  animation:floatY 12s ease-in-out infinite}

@keyframes orbPulse{0%,100%{opacity:0.5;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)}}
@keyframes floatYs{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes shimmer{0%{background-position:200% center}100%{background-position:-200% center}}
@keyframes spinS{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes spinR{from{transform:rotate(360deg)}to{transform:rotate(0)}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 30px rgba(216,179,106,0.3),0 8px 40px rgba(57,40,75,0.08)}50%{box-shadow:0 0 60px rgba(216,179,106,0.55),0 16px 60px rgba(57,40,75,0.14)}}
@keyframes particleFly{0%{transform:translateY(0) translateX(0) scale(1);opacity:1}100%{transform:translateY(var(--py)) translateX(var(--px)) scale(0);opacity:0}}
@keyframes cardRevealGlow{0%{box-shadow:0 0 0 0 rgba(216,179,106,0)}30%{box-shadow:0 0 80px 20px rgba(216,179,106,0.4)}100%{box-shadow:0 16px 64px rgba(57,40,75,0.18),0 0 40px rgba(216,179,106,0.12)}}
@keyframes fadeSlideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes twinkle{0%,100%{opacity:0.2;transform:scale(0.7)}50%{opacity:1;transform:scale(1.2)}}
@keyframes moonGlow{0%,100%{filter:drop-shadow(0 0 12px rgba(216,179,106,0.4))}50%{filter:drop-shadow(0 0 32px rgba(216,179,106,0.85))}}

/* container */
.pac-con{max-width:1100px;margin:0 auto;padding:0 48px;position:relative;z-index:2}
@media(max-width:768px){.pac-con{padding:0 20px}}

/* header */
.pac-header{text-align:center;margin-bottom:64px}
.pac-ey{display:block;font-family:'Jost',sans-serif;font-weight:400;font-size:0.64rem;letter-spacing:0.4em;text-transform:uppercase;color:var(--accent);margin-bottom:16px}
.pac-title{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(2.4rem,5vw,4rem);line-height:1.12;color:var(--plum);margin-bottom:20px}
.pac-title em{font-style:italic;
  background:linear-gradient(110deg,var(--gold-deep),var(--gold-bright),var(--gold),var(--gold-bright),var(--gold-deep));
  background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation:shimmer 5s linear infinite}
.pac-instruction{
  font-size:1.05rem;color:var(--text-mid);font-weight:300;
  max-width:560px;margin:0 auto;line-height:1.9;
  padding:20px 32px;
  background:rgba(255,255,255,0.55);
  border:1px solid rgba(216,179,106,0.2);
  backdrop-filter:blur(10px);
}
.pac-instruction strong{color:var(--plum);font-weight:400}
.breath-indicator{
  display:flex;align-items:center;justify-content:center;gap:12px;
  margin-top:14px;font-size:0.78rem;letter-spacing:0.2em;color:var(--text-soft);
  font-family:'Cinzel',serif;
}
.breath-dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--gold);animation:pulse 2s ease-in-out infinite;
}

/* ══ CARDS STAGE ══ */
.cards-stage{
  display:flex;justify-content:center;align-items:flex-end;
  gap:0;margin:60px 0;
  perspective:1400px;
  min-height:340px;
  position:relative;
}

/* individual card wrapper */
.pac-card-wrap{
  position:relative;flex-shrink:0;
  transition:transform 0.5s cubic-bezier(0.25,0.46,0.45,0.94);
  cursor:pointer;
  margin:0 -12px; /* fan overlap */
}
/* Fan layout via transform */
.pac-card-wrap:nth-child(1){transform:rotate(-18deg) translateY(28px)}
.pac-card-wrap:nth-child(2){transform:rotate(-9deg) translateY(12px)}
.pac-card-wrap:nth-child(3){transform:rotate(0deg) translateY(0px)}
.pac-card-wrap:nth-child(4){transform:rotate(9deg) translateY(12px)}
.pac-card-wrap:nth-child(5){transform:rotate(18deg) translateY(28px)}

.pac-card-wrap:hover:not(.selected):not(.dimmed){
  transform:rotate(0deg) translateY(-28px) scale(1.05) !important;
  z-index:10;
}
.pac-card-wrap.selected{
  transform:rotate(0deg) translateY(-40px) scale(1.08) !important;
  z-index:20;pointer-events:none;
}
.pac-card-wrap.dimmed{
  opacity:0.35;
  transform:translateY(20px) scale(0.95) !important;
  pointer-events:none;
  transition:all 0.6s ease;
}

/* THE CARD */
.pac-card{
  width:150px;height:255px;
  position:relative;
  transform-style:preserve-3d;
  transition:transform 0.9s cubic-bezier(0.4,0,0.2,1);
  border-radius:14px;
}
.pac-card.flipped{transform:rotateY(180deg)}

/* card face & back */
.card-face,.card-back{
  position:absolute;inset:0;
  border-radius:14px;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
}

/* ── CARD BACK (face-down) ── */
.card-back{
  background:linear-gradient(160deg,var(--plum-mid),var(--plum-deep));
  border:2px solid rgba(216,179,106,0.45);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  box-shadow:0 12px 48px rgba(57,40,75,0.25),0 0 0 1px rgba(255,255,255,0.08),inset 0 1px 0 rgba(255,255,255,0.06);
}
.card-back::before{
  content:'';position:absolute;inset:8px;
  border:1px solid rgba(216,179,106,0.25);border-radius:8px;
}
/* Sacred geometry pattern on back */
.cb-pattern{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
}
.cb-ring{
  position:absolute;border-radius:50%;border:1px solid rgba(216,179,106,0.2);
}
.cb-ring1{width:100px;height:100px;animation:spinS 20s linear infinite}
.cb-ring2{width:70px;height:70px;animation:spinR 15s linear infinite}
.cb-ring3{width:40px;height:40px;animation:spinS 10s linear infinite}
.cb-glyph{
  font-size:2rem;color:rgba(216,179,106,0.7);
  position:relative;z-index:1;
  animation:moonGlow 4s ease-in-out infinite;
}
/* corner ornaments on back */
.cb-co{
  position:absolute;font-size:0.6rem;color:rgba(216,179,106,0.4);
}
.cb-co.tl{top:14px;left:14px}
.cb-co.tr{top:14px;right:14px}
.cb-co.bl{bottom:14px;left:14px}
.cb-co.br{bottom:14px;right:14px}
/* shimmer overlay on back */
.card-back::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,0.06) 0%,transparent 60%);
  border-radius:14px;
}

/* hover glow on back */
.pac-card-wrap:hover:not(.selected):not(.dimmed) .card-back{
  box-shadow:0 20px 70px rgba(57,40,75,0.3),0 0 40px rgba(216,179,106,0.25),0 0 0 1px rgba(216,179,106,0.3);
  border-color:rgba(216,179,106,0.7);
}
.pac-card-wrap:hover:not(.selected):not(.dimmed) .cb-glyph{
  color:rgba(216,179,106,0.95);
}

/* ── CARD FRONT (revealed) ── */
.card-face{
  transform:rotateY(180deg);
  display:flex;flex-direction:column;align-items:center;
  border:2px solid rgba(216,179,106,0.5);
  overflow:hidden;
  animation:none;
}
.card-face.revealed{animation:cardRevealGlow 1.5s ease forwards}

/* card front bg — gradient per card via JS */
.cf-bg{
  position:absolute;inset:0;border-radius:12px;
}
/* inner border */
.cf-border{
  position:absolute;inset:10px;border:1px solid rgba(216,179,106,0.3);border-radius:8px;pointer-events:none;z-index:3;
}
/* corner ornaments */
.cf-co{position:absolute;font-size:0.65rem;color:rgba(216,179,106,0.6);z-index:4}
.cf-co.tl{top:14px;left:14px}
.cf-co.tr{top:14px;right:14px}
.cf-co.bl{bottom:14px;left:14px}
.cf-co.br{bottom:14px;right:14px}

.cf-content{
  position:relative;z-index:2;
  display:flex;flex-direction:column;align-items:center;
  justify-content:space-between;
  height:100%;padding:24px 14px 20px;text-align:center;
}
.cf-num{
  font-family:'Cinzel',serif;font-size:0.55rem;letter-spacing:0.25em;
  color:rgba(216,179,106,0.7);margin-bottom:4px;
}

/* ══ REVEAL PANEL ══ */
.reveal-panel{

}

.rp-card-large{

  animation:fadeSlideUp 0.8s ease forwards;
}
.rp-card-large::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,transparent,var(--gold),rgba(196,176,232,0.8),var(--gold),transparent);
}
.rp-card-large::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:2px;

}

.rp-header{
  padding:48px 52px 36px;

  border-bottom:1px solid rgba(216,179,106,0.15);
  position:relative;
  overflow:hidden;
}
.rp-header::before{
  content:'';position:absolute;inset:0;

}

}
.rp-card-name{
  font-family:'Cormorant Garamond',serif;font-size:clamp(1.8rem,4vw,2.8rem);

}
.rp-card-tagline{
  font-size:0.88rem;color:var(--text-mid);font-style:italic;

}

.rp-body{padding:40px 52px 48px}

.rp-cta-area{
  text-align:center;

}
